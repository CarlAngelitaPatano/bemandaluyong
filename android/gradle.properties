# Tuned for a low-memory machine (5 GB RAM).
#  -Xmx768M            smaller Java heap leaves room for the native heap
#  MaxMetaspaceSize    class metadata capped
#  TieredStopAtLevel=1 use only the lightweight C1 JIT; the C2 compiler is a
#                      heavy native-memory user and was crashing the daemon
#  Xss512k             smaller thread stacks
#  UseSerialGC         single-threaded GC, lowest overhead
org.gradle.jvmargs=-Xmx768M -XX:MaxMetaspaceSize=320M -XX:ReservedCodeCacheSize=64m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k -Dfile.encoding=UTF-8
# One worker at a time — fewer threads, far less peak memory.
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configureondemand=true
# Don't keep a background daemon alive between builds — on low-RAM machines
# it hangs and holds cache locks, blocking the next build. One-shot builds
# are a bit slower but avoid the "Timeout waiting to lock" zombie problem.
org.gradle.daemon=false
# Compile Kotlin inside the Gradle process instead of launching a second
# JVM — saves a whole daemon's worth of memory on a low-RAM machine.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
